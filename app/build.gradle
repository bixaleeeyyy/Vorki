plugins {
    id 'com.android.application'
}

android {
    namespace 'com.vorki.app'
    compileSdk 36

    defaultConfig {
        applicationId 'com.vorki.app'
        minSdk 26
        targetSdk 36
        versionCode 2
        versionName '2.0.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // F-Droid: do not embed Google's dependency-info signing blob
    dependenciesInfo {
        includeInApk = false
        includeInBundle = false
    }

    lint {
        abortOnError false
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'androidx.exifinterface:exifinterface:1.3.7'
}
